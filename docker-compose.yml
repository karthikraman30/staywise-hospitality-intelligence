services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: staywise
      POSTGRES_USER: staywise
      POSTGRES_PASSWORD: staywise
    ports:
      - "54329:5432"
    volumes:
      - staywise_postgres_data:/var/lib/postgresql/data
      - ./:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staywise -d staywise"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  staywise_postgres_data:
